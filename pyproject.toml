[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gitgraph"
dynamic = ["version"]
description = "Generate an accurate, vertical Git history graph as a standalone SVG for README files."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["git", "graph", "svg", "visualization", "readme"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
gitgraph = "gitgraph.cli:main"

[tool.setuptools.dynamic]
version = { attr = "gitgraph._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gitgraph = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
